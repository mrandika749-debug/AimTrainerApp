name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          mkdir -p project
          unzip -o AimTrainerApp.zip -d project

          if [ -f "project/settings.gradle.kts" ]; then
            echo "Project found directly"
          elif [ -f "project/AimTrainerApp/settings.gradle.kts" ]; then
            echo "Project found inside AimTrainerApp folder"
            cp -r project/AimTrainerApp/. project/
          else
            echo "ERROR: Android project not found"
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimTrainerApp-debug
          path: project/app/build/outputs/apk/debug/*.apk
