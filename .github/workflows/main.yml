name: Build android apk

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -o AimTrainerApp.zip -d project

          echo "Checking Android project..."

          if [ -f "project/AimTrainerApp/settings.gradle" ]; then
            echo "Android project found!"
            echo "PROJECT_DIR=project/AimTrainerApp" >> "$GITHUB_ENV"
          else
            echo "ERROR: settings.gradle not found"
            find project -type f | sort
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimTrainerApp-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
